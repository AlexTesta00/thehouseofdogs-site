# CI/CD House of Dogs
# A ogni push su main: controlla la sintassi PHP, esegue i test dell'app pagamenti e delle prenotazioni con bonifico
# e carica via FTP su Hostinger la cartella site/ (document root) e l'app pagamenti (payments/public -> payments/,
# parte privata -> payments-private/).
#
# Segreti da creare su GitHub (Settings > Secrets and variables > Actions > New repository secret):
#   FTP_SERVER    -> host FTP di Hostinger (hPanel > Siti web > Gestisci > File > Account FTP, es. ftp.tuodominio.it o un IP)
#   FTP_USERNAME  -> nome utente FTP
#   FTP_PASSWORD  -> password FTP
# Variabile opzionale (Settings > Secrets and variables > Actions > Variables):
#   FTP_SERVER_DIR -> cartella remota di destinazione. Default: ./
#                     L'account FTP di Hostinger e' gia' radicato dentro public_html (verificato il 2026-08-23:
#                     con ./public_html/ i file finivano in public_html/public_html/). Impostare la variabile
#                     solo se l'account FTP dovesse cambiare radice.
#   PAYMENTS_BASE_URL -> URL pubblico dell'app pagamenti. Default: https://www.thehouseofdog.it/payments
# Segreto per l'app pagamenti:
#   PAYMENTS_MOLLIE_API_KEY -> chiave API Mollie (test_... o live_...). Il deploy genera config.php sul server da questo
#                              segreto; la chiave non passa mai dal repository.
# Segreti per le prenotazioni con bonifico (site/prenota.php; parte privata in site/_prenotazioni/, bloccata dal web):
#   Le coordinate bancarie mostrate al cliente stanno nel repository, in site/_prenotazioni/config/bank.php.
#   I tre segreti BOOKING_IBAN, BOOKING_ACCOUNT_HOLDER e BOOKING_BIC sono FACOLTATIVI: se presenti hanno la precedenza.
#   BOOKING_IBAN            -> IBAN del conto su cui arrivano le caparre (con o senza spazi).
#                              Prima del deploy viene controllato con mod-97: se non è valido il deploy si ferma.
#   BOOKING_ACCOUNT_HOLDER  -> intestatario del conto, mostrato al cliente nei dati per il bonifico.
#   BOOKING_BIC             -> facoltativo: BIC/SWIFT da mostrare al cliente (8 o 11 caratteri).
#   REVOLUT_WEBHOOK_SECRET  -> segreto di firma del webhook Revolut (inizia con wsk_). Per ruotarlo senza interruzioni
#                              si possono indicare più segreti separati da virgola.
#   Il deploy genera site/_prenotazioni/config/config.php dai segreti presenti: i loro valori non vengono mai stampati
#   nel log. Senza alcun segreto il file non viene generato e valgono le coordinate di bank.php; senza
#   REVOLUT_WEBHOOK_SECRET si prenota lo stesso, ma lo stato non si aggiorna da solo.
#   Webhook da registrare in Revolut Business (Business API, Webhooks v2):
#     URL:    https://www.thehouseofdog.it/webhook-revolut.php
#     Eventi: TransactionCreated e TransactionStateChanged
#   Email delle prenotazioni: a ogni richiesta partono con mail() una notifica all'esercente e un riepilogo al cliente
#   (mittente noreply@thehouseofdog.it). Variabile opzionale (Variables, non Secrets):
#     BOOKING_MERCHANT_EMAIL -> indirizzo che riceve le notifiche. Default: houseofdogdigiuseppe@outlook.it.
#                               Usata solo se è un indirizzo email valido.

name: Deploy su Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  verifica:
    name: Controllo PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint di tutti i file PHP
        run: |
          set -e
          find site payments tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test automatici app pagamenti
        run: php payments/tools/selftest.php --http

      - name: Test automatici prenotazioni con bonifico
        run: php tests/prenotazioni-selftest.php --http

      - name: Controllo asset essenziali
        run: |
          set -e
          for f in site/index.php site/invia.php site/assets/hero-scrub.mp4 site/assets/hero-ambient.mp4 site/assets/css/custom.css site/assets/js/hero.js \
                   site/prenota.php site/prenotazione.php site/webhook-revolut.php site/assets/js/prenota.js site/_prenotazioni/.htaccess; do
            [ -s "$f" ] || { echo "Manca o e' vuoto: $f"; exit 1; }
          done
          echo "Asset ok"

  deploy:
    name: Deploy FTP
    needs: verifica
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Prenotazioni con bonifico (site/_prenotazioni/) ----
      # config.php (IBAN, intestatario, BIC, segreto del webhook Revolut) viene generato qui dai segreti del repository
      # e caricato insieme a site/. I valori non vengono mai stampati: il log riporta solo quali chiavi sono state scritte.
      # Senza segreti il file non viene scritto e valgono le coordinate di site/_prenotazioni/config/bank.php.
      # Le impostazioni email restano quelle predefinite (mail()); la variabile BOOKING_MERCHANT_EMAIL, se valida,
      # cambia solo l'indirizzo che riceve le notifiche.
      # Database, log, outbox e segreto applicativo che l'app crea sul server in _prenotazioni/data/ sono esclusi dal caricamento.
      - name: Prepara configurazione prenotazioni
        env:
          BOOKING_IBAN: ${{ secrets.BOOKING_IBAN }}
          BOOKING_ACCOUNT_HOLDER: ${{ secrets.BOOKING_ACCOUNT_HOLDER }}
          BOOKING_BIC: ${{ secrets.BOOKING_BIC }}
          REVOLUT_WEBHOOK_SECRET: ${{ secrets.REVOLUT_WEBHOOK_SECRET }}
          BOOKING_MERCHANT_EMAIL: ${{ vars.BOOKING_MERCHANT_EMAIL }}
        run: |
          set -e
          rm -f site/_prenotazioni/config/config.php
          php -r '
            require "site/_prenotazioni/lib/validation.php";
            $iban = hodbook_iban_normalize((string)getenv("BOOKING_IBAN"));
            $holder = trim((string)preg_replace("/\s+/", " ", (string)getenv("BOOKING_ACCOUNT_HOLDER")));
            $cfg = [];
            $set = [];
            if ($iban !== "") {
              if (!hodbook_iban_valid($iban)) { fwrite(STDERR, "BOOKING_IBAN non valido: controllo mod-97 o lunghezza non superati.\n"); exit(1); }
              $cfg["bank_iban"] = $iban;
              $set[] = "bank_iban";
            }
            if ($holder !== "") {
              $cfg["bank_account_holder"] = $holder;
              $set[] = "bank_account_holder";
            }
            $bic = strtoupper((string)preg_replace("/\s+/", "", (string)getenv("BOOKING_BIC")));
            if ($bic !== "") {
              if (!hodbook_bic_valid($bic)) { fwrite(STDERR, "BOOKING_BIC non ha il formato atteso (8 o 11 caratteri).\n"); exit(1); }
              $cfg["bank_bic"] = $bic;
              $set[] = "bank_bic";
            }
            $secrets = preg_split("/[\s,]+/", (string)getenv("REVOLUT_WEBHOOK_SECRET"), -1, PREG_SPLIT_NO_EMPTY) ?: [];
            foreach ($secrets as $s) {
              if (!hodbook_webhook_secret_valid($s)) { fwrite(STDERR, "REVOLUT_WEBHOOK_SECRET non valido: ogni segreto deve iniziare con wsk_ (formato dei segreti di firma Revolut).\n"); exit(1); }
            }
            if ($secrets !== []) {
              $cfg["revolut_webhook_secrets"] = array_values(array_unique($secrets));
              $set[] = "revolut_webhook_secrets (" . count($cfg["revolut_webhook_secrets"]) . ")";
            }
            $merchant = trim((string)getenv("BOOKING_MERCHANT_EMAIL"));
            if ($merchant !== "") {
              if (hodbook_email_header_safe($merchant)) {
                $cfg["merchant_email"] = $merchant;
                $set[] = "merchant_email";
              } else {
                echo "Attenzione: BOOKING_MERCHANT_EMAIL non è un indirizzo email valido, resta in uso il valore predefinito.\n";
              }
            }
            if ($cfg === []) {
              echo "Nessun segreto o variabile per le prenotazioni: config.php non generato, valgono le coordinate di site/_prenotazioni/config/bank.php.\n";
            } else {
              file_put_contents("site/_prenotazioni/config/config.php", "<?php\n/* Generato dal deploy GitHub: non modificare a mano, cambia i segreti del repository. */\nreturn " . var_export($cfg, true) . ";\n");
              echo "config.php prenotazioni generato con: " . implode(", ", $set) . "\n";
            }
            if ($secrets === []) { echo "Attenzione: REVOLUT_WEBHOOK_SECRET assente, il webhook risponde 503 e lo stato delle prenotazioni non si aggiorna da solo.\n"; }
          '

      - name: Carica site/ su Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./site/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          state-name: .ftp-deploy-sync-state.json
          timeout: 120000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.ht_richieste.log
            **/_prenotazioni/data/*.sqlite*
            **/_prenotazioni/data/*.log
            **/_prenotazioni/data/app-secret.php
            **/_prenotazioni/data/outbox/**
            **/Thumbs.db
            **/.DS_Store

      # ---- App pagamenti (payments/) ----
      # Parte pubblica  -> public_html/payments/          (https://www.thehouseofdog.it/payments/)
      # Parte privata   -> public_html/payments-private/  (bloccata dal web dai .htaccess; app-path.php la trova da sola)
      # La chiave Mollie arriva dal segreto PAYMENTS_MOLLIE_API_KEY: config.php viene generato qui e mai committato.
      # Senza segreto, config.php non viene scritto e un eventuale file caricato a mano sul server resta intatto.
      - name: Prepara cartella privata pagamenti
        env:
          PAYMENTS_MOLLIE_API_KEY: ${{ secrets.PAYMENTS_MOLLIE_API_KEY }}
          PAYMENTS_BASE_URL: ${{ vars.PAYMENTS_BASE_URL || 'https://www.thehouseofdog.it/payments' }}
        run: |
          set -e
          mkdir -p deploy-private
          cp -r payments/app payments/config payments/data deploy-private/
          rm -f deploy-private/config/config.php
          if [ -n "$PAYMENTS_MOLLIE_API_KEY" ]; then
            php -r '
              $key = getenv("PAYMENTS_MOLLIE_API_KEY");
              if (!preg_match("/^(test|live)_[A-Za-z0-9]{20,}$/", $key)) { fwrite(STDERR, "PAYMENTS_MOLLIE_API_KEY non ha il formato atteso (test_... o live_...)\n"); exit(1); }
              $cfg = [
                "mollie_api_key" => $key,
                "require_admin_login" => false,
                "merchant_name" => "The House Of Dog",
                "purchase_description" => "Caparra cucciolo - The House Of Dog",
                "base_url" => rtrim(getenv("PAYMENTS_BASE_URL"), "/"),
              ];
              file_put_contents("deploy-private/config/config.php", "<?php\n/* Generato dal deploy GitHub: non modificare a mano, cambia i segreti del repository. */\nreturn " . var_export($cfg, true) . ";\n");
            '
            echo "config.php generato (modalità: $(echo "$PAYMENTS_MOLLIE_API_KEY" | cut -c1-4)...)"
          else
            echo "Segreto PAYMENTS_MOLLIE_API_KEY assente: config.php non generato (modalità demo o file caricato a mano)."
          fi

      - name: Carica payments/public su Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./payments/public/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}payments/
          state-name: .ftp-deploy-sync-state.json
          timeout: 120000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/Thumbs.db
            **/.DS_Store

      - name: Carica parte privata pagamenti su Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy-private/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}payments-private/
          state-name: .ftp-deploy-sync-state.json
          timeout: 120000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/data/*.sqlite*
            **/data/*.log
            **/Thumbs.db
            **/.DS_Store
